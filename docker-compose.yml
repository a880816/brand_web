services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_storage:/var/www/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
      - public_storage:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
  node:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm install && npm run build && tail -f /dev/null"
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    healthcheck:
      test: ["CMD-SHELL", "test -f public/build/manifest.json"]
      interval: 5s
      timeout: 3s
      retries: 30
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-brand_web}
      POSTGRES_USER: ${DB_USERNAME:-brand_web}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brand_web_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-brand_web} -d ${DB_DATABASE:-brand_web}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  vendor_data:
  node_modules:
  public_storage:
